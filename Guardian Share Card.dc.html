<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0f12;color:#e8e9ec;-webkit-font-smoothing:antialiased;--fd:'Barlow Condensed';--fm:'JetBrains Mono'}
body[data-font="space"]{--fd:'Space Grotesk';--fm:'Space Mono'}
a{color:#e8e9ec;text-decoration:none}a:hover{color:oklch(0.82 0.13 85)}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="./guardian.js"></script>
</helmet>
<div style="min-height:100vh;background:#0d0f12;display:flex;flex-direction:column;align-items:safe center;">
<header style="box-sizing:border-box;width:100%;max-width:1200px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
  <a href="./Guardian Search.dc.html" style="font-family:var(--fm),monospace;font-size:12px;letter-spacing:.14em;color:#8a8f98;text-transform:uppercase;text-decoration:none;">← Search{{ platformLine }}</a>
  <nav style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;font-family:var(--fd),sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;">
    <a href="{{ profileHref }}" style="text-decoration:none;">Profile</a>
    <sc-if value="{{ canEdit }}" hint-placeholder-val="{{ false }}"><a href="{{ editHref }}" style="text-decoration:none;">Edit plaques</a></sc-if>
    <sc-if value="{{ showSignIn }}" hint-placeholder-val="{{ false }}"><button onClick="{{ signIn }}" style="font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:0;color:#e8e9ec;cursor:pointer;" style-hover="color:oklch(0.82 0.13 85);">Sign in</button></sc-if>
    <a href="{{ raidUrl }}" target="_blank" style="text-decoration:none;">Raid Report ↗</a>
    <a href="{{ dungeonUrl }}" target="_blank" style="text-decoration:none;">Dungeon Report ↗</a>
  </nav>
</header>
<div ref="{{ stageRef }}" style="flex:none;width:1480px;height:880px;display:flex;align-items:center;justify-content:center;perspective:1800px;background:#0d0f12;--rx:0deg;--ry:0deg;--px:50%;--py:50%;--holo:0.55;">
  <div style="width:1200px;height:630px;position:relative;border-radius:28px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .08s linear;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04);background:{{ tier.frame }};padding:14px;box-sizing:border-box;">
    <div style="position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:#0d0f12;display:grid;grid-template-rows:1fr auto auto auto;">

      <div style="position:relative;min-height:200px;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:0 32px 0 224px;background:linear-gradient(90deg,rgba(13,15,18,0) 0%,rgba(13,15,18,0) 20%,rgba(13,15,18,.35) 55%,rgba(13,15,18,.75) 100%),{{ emblemBg }};">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-family:var(--fd),sans-serif;font-weight:700;font-size:88px;line-height:.85;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.7);">{{ displayName }}</span>
          <div style="display:flex;gap:28px;flex-wrap:wrap;text-shadow:0 1px 6px rgba(0,0,0,.8);">
            <sc-for list="{{ headerStats }}" as="hs" hint-placeholder-count="3">
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span style="font-family:var(--fm),monospace;font-size:22px;font-weight:500;color:oklch(0.86 0.12 85);">{{ hs.value }}</span>
                <span style="font-family:var(--fd),sans-serif;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#c9ccd2;">{{ hs.label }}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;min-width:104px;height:56px;padding:0 16px;border-radius:28px;background:radial-gradient(circle at 35% 30%,oklch(0.92 0.1 90),oklch(0.66 0.12 72));color:#0d0f12;font-family:var(--fm),monospace;font-weight:500;font-size:24px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.5);">{{ power }}</div>
      </div>

      <div style="height:6px;display:flex;background:oklch(0.72 0.11 80);">
        <sc-for list="{{ commendParts }}" as="cp" hint-placeholder-count="4">
          <div data-tip="{{ cp.title }}" style="flex:{{ cp.flex }};background:{{ cp.color }};min-width:0;"></div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;padding:20px 32px;">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 108px;gap:12px;">
          <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
            <div style="height:108px;box-sizing:border-box;border:1px solid #2a2f37;border-radius:6px;background:#111418;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;">
              <span style="font-family:var(--fd),sans-serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#8a8f98;">{{ s.label }}</span>
              <span style="font-family:var(--fm),monospace;font-size:40px;font-weight:500;line-height:1;">{{ s.value }}</span>
            </div>
          </sc-for>
          <div data-tip="Raid Report
{{ raidShort }}" style="height:108px;width:108px;box-sizing:border-box;border-radius:6px;border:1px solid #2a2f37;background:#111418;padding:8px;display:flex;align-items:center;justify-content:center;">{{ qrImg }}</div>
        </div>
        <div style="height:108px;box-sizing:border-box;border:1px solid #2a2f37;border-radius:6px;background:#111418;padding:16px 18px;display:flex;gap:24px;align-items:stretch;">
          <sc-for list="{{ pipRows }}" as="row" hint-placeholder-count="3">
            <div style="flex:{{ row.flex }};min-width:0;display:flex;flex-direction:column;justify-content:space-between;">
              <span style="font-family:var(--fd),sans-serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#8a8f98;white-space:nowrap;">{{ row.title }}</span>
              <div style="display:flex;gap:4px;">
                <sc-for list="{{ row.pips }}" as="pp" hint-placeholder-count="10">
                  <div data-tip="{{ pp.name }}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;">
                    <span style="width:18px;height:18px;border-radius:50%;box-sizing:border-box;background:{{ pp.fill }};border:2px solid {{ pp.ring }};box-shadow:{{ pp.glow }};"></span>
                    <span style="font-family:var(--fm),monospace;font-size:11px;line-height:1;color:{{ pp.num }};">{{ pp.clears }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 32px;border-top:1px solid #22262d;font-family:var(--fm),monospace;font-size:14px;color:#8a8f98;">
        <span></span>
        <span data-tip="{{ tier.breakdown }}" style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:var(--fd),sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;padding:2px 10px;border-radius:4px;background:{{ tier.badge }};color:#0d0f12;">{{ tier.code }}</span>
          <span data-tip="{{ serialTip }}" style="color:oklch(0.82 0.13 85);">◆ GDN · {{ serial }}</span>
        </span>
      </div>

      <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:var(--holo);background:repeating-linear-gradient(115deg,#ff4fa0 0%,#ffd84f 6%,#5effa1 12%,#4fd8ff 18%,#a14fff 24%,#ff4fa0 30%);background-size:300% 300%;background-position:var(--px) var(--py);filter:saturate(1.2) brightness(.55);"></div>
      <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:calc(var(--holo) * .8);background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,255,255,.6) 0 1px,transparent 1.5px);background-size:23px 23px,37px 37px;background-position:calc(var(--px) * .3) calc(var(--py) * .3),calc(var(--px) * -.2) calc(var(--py) * .5);"></div>
      <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(circle at var(--px) var(--py),rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 25%,transparent 55%);"></div>
    </div>
  </div>
</div>
<sc-if value="{{ canEdit }}" hint-placeholder-val="{{ false }}">
  <section style="box-sizing:border-box;width:100%;max-width:1200px;padding:8px 32px 72px;display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
        <span style="font-family:var(--fd),sans-serif;font-weight:600;font-size:24px;letter-spacing:.04em;text-transform:uppercase;">Card emblem</span>
        <div style="display:flex;border:1px solid #2a2f37;">
          <sc-for list="{{ emTabs }}" as="tb" hint-placeholder-count="2">
            <button onClick="{{ tb.select }}" style="font-family:var(--fd),sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;border:0;cursor:pointer;background:{{ tb.bg }};color:{{ tb.color }};">{{ tb.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <sc-if value="{{ isColl }}" hint-placeholder-val="{{ false }}">
          <input value="{{ emFilter }}" onChange="{{ setEmFilter }}" placeholder="Filter emblems" style="font-family:var(--fm),monospace;font-size:13px;color:#e8e9ec;background:#111418;border:1px solid #2a2f37;padding:8px 10px;outline:none;width:200px;">
        </sc-if>
        <span style="font-family:var(--fm),monospace;font-size:12px;color:#8a8f98;">{{ emStatus }}</span>
      </div>
    </div>
    <sc-if value="{{ isChars }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">
        <sc-for list="{{ charEmblems }}" as="ce" hint-placeholder-count="3">
          <button onClick="{{ ce.pick }}" style="height:64px;border:2px solid {{ ce.border }};border-radius:6px;cursor:pointer;background:{{ ce.bg }};display:flex;align-items:center;justify-content:flex-end;padding:0 14px;">
            <span style="font-family:var(--fd),sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#e8e9ec;text-shadow:0 1px 4px rgba(0,0,0,.9);">{{ ce.label }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ isColl }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;max-height:360px;overflow:auto;padding-right:4px;">
        <sc-for list="{{ collEmblems }}" as="ee" hint-placeholder-count="24">
          <button onClick="{{ ee.pick }}" data-tip="{{ ee.name }}" style="aspect-ratio:1;border:2px solid {{ ee.border }};border-radius:4px;cursor:pointer;background:{{ ee.bg }};padding:0;"></button>
        </sc-for>
      </div>
    </sc-if>
  </section>
</sc-if>
  <div ref="{{ tipRef }}" style="position:fixed;left:0;top:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .08s;max-width:340px;background:#0d0f12;border:1px solid oklch(0.72 0.11 80);border-radius:6px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:6px;">
    <span data-tip-title="1" style="font-family:var(--fd),sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:oklch(0.86 0.12 85);"></span>
    <span data-tip-body="1" style="font-family:var(--fm),monospace;font-size:12px;line-height:1.6;color:#c9ccd2;white-space:pre-line;"></span>
  </div>
  <sc-if value="{{ hasPlayerRaw }}" hint-placeholder-val="{{ false }}"><div style="display:none;"><dc-import name="Guardian Landing" font="{{ font }}" player="{{ playerRaw }}" hint-size="0,0"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:990},&quot;player&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;holo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.55,&quot;tsType&quot;:&quot;number&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:1,&quot;default&quot;:10,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;idle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tierPreview&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;C&quot;,&quot;R&quot;,&quot;SR&quot;,&quot;UR&quot;,&quot;SPR&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;barlow&quot;,&quot;space&quot;],&quot;default&quot;:&quot;space&quot;,&quot;tsType&quot;:&quot;'barlow'|'space'&quot;}}">
class Component extends DCLogic {
  stageRef = React.createRef();
  tipRef = React.createRef();
  showTip(e) {
    const tip = this.tipRef.current; if (!tip) return;
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = '0'; return; }
    const txt = t.getAttribute('data-tip') || '';
    if (tip._txt !== txt) { const [head, ...rest] = txt.split('\n'); tip.querySelector('[data-tip-title]').textContent = head; const b = tip.querySelector('[data-tip-body]'); b.textContent = rest.join('\n'); b.style.display = rest.length ? '' : 'none'; tip._txt = txt; }
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 18;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
    if (y + hh > window.innerHeight - 8) y = e.clientY - hh - 14;
    tip.style.transform = `translate(${x}px,${y}px)`;
    tip.style.opacity = '1';
  }
  state = { card: null, emTab: 'chars', emFilter: '', coll: null, emStatus: '' };
  async loadCollections() {
    if (this.collLoading || !this.P) return;
    this.collLoading = true;
    this.setState({ emStatus: 'Loading collections…' });
    try {
      const prof = await GL.api(`/Destiny2/${this.P.type}/Profile/${this.P.id}/?components=800`);
      const owned = (prof.profileCollectibles && prof.profileCollectibles.data && prof.profileCollectibles.data.collectibles) || {};
      const man = await GL.api('/Destiny2/Manifest/');
      const paths = man.jsonWorldComponentContentPaths.en;
      this.setState({ emStatus: 'Loading emblem list…' });
      const [nodes, colls] = await Promise.all([
        fetch('https://www.bungie.net' + paths.DestinyPresentationNodeDefinition).then(r => r.json()),
        fetch('https://www.bungie.net' + paths.DestinyCollectibleDefinition).then(r => r.json())
      ]);
      const out = [], seen = new Set();
      const walk = hh => { const n = nodes[hh]; if (!n || seen.has(hh)) return; seen.add(hh);
        (n.children.collectibles || []).forEach(c => { const d = colls[c.collectibleHash]; const st = owned[c.collectibleHash]; if (d && st && (st.state & 1) === 0) out.push({ hash: c.collectibleHash, item: d.itemHash, name: d.displayProperties.name, icon: d.displayProperties.icon }); });
        (n.children.presentationNodes || []).forEach(c => walk(c.presentationNodeHash)); };
      Object.entries(nodes).filter(([, n]) => n.displayProperties && n.displayProperties.name === 'Emblems').forEach(([hh]) => walk(+hh));
      const uniq = [...new Map(out.map(x => [x.item, x])).values()].sort((a, b) => a.name.localeCompare(b.name));
      this.setState({ coll: uniq, emStatus: uniq.length + ' emblems' });
    } catch (e) { this.collLoading = false; this.setState({ emStatus: 'Collections unavailable (' + e.message + ')' }); }
  }
  async pickEmblem(path, label) {
    if (!path || !this.P) return;
    this.setState({ emblemOverride: path, emStatus: 'Saving…' });
    try {
      const id = this.P.id;
      let d = await GL.loadEdits(id);
      if (!d) { try { d = JSON.parse(localStorage.getItem(GL.k(id, 'profile'))); } catch (e) {} }
      if (!d) { const base = await fetch('./profile.json').then(r => r.json()); d = id === GL.OWNER ? base : GL.blank(base); }
      d.profile = { ...(d.profile || {}), cardEmblem: path };
      localStorage.setItem(GL.k(id, 'profile'), JSON.stringify(d));
      const shared = await GL.saveEdits(id, d);
      this.setState({ emStatus: (label ? label + ' · ' : '') + (shared ? 'saved for everyone' : 'saved in this browser') });
    } catch (e) { this.setState({ emStatus: e.message }); }
  }
  async pickCollectible(ee) {
    this.setState({ emStatus: 'Loading ' + ee.name + '…' });
    const d = await GL.api(`/Destiny2/Manifest/DestinyInventoryItemDefinition/${ee.item}/`).catch(() => null);
    const path = d && (d.secondaryIcon || d.secondarySpecial);
    if (!path) return this.setState({ emStatus: 'No banner art for ' + ee.name });
    this.pickEmblem(path, ee.name);
  }
  applyFont() { document.body.dataset.font = this.props.font ?? 'space'; }
  setVars(x, y) {
    const el = this.stageRef.current; if (!el) return;
    const tilt = this.props.tilt ?? 10;
    el.style.setProperty('--ry', ((x - 0.5) * tilt * 2).toFixed(2) + 'deg');
    el.style.setProperty('--rx', ((0.5 - y) * tilt * 1.4).toFixed(2) + 'deg');
    el.style.setProperty('--px', (x * 100).toFixed(1) + '%');
    el.style.setProperty('--py', (y * 100).toFixed(1) + '%');
    el.style.setProperty('--holo', String((this.props.holo ?? 0.55) * (this.tierHolo ?? 1)));
  }
  componentDidMount() {
    this.applyFont();
    this.reload = () => { if (!this.P) return; try { const s = localStorage.getItem(GL.k(this.P.id, 'card')); if (s && s !== this.raw) { this.raw = s; this.setState({ card: JSON.parse(s) }); } } catch (e) {} };
    const wait = async () => {
      if (!window.GL) return setTimeout(wait, 50);
      try { this.P = await GL.resolve(GL.parse(this.props.player)); } catch (e) { this.P = null; }
      await GL.ready;
      this.setState({ player: this.P, noPlayer: !this.P, playerRaw: this.P ? this.P.type + '-' + this.P.id : '', auth: GL.auth() });
      this.reload();
    };
    wait();
    window.addEventListener('storage', this.onStorage = e => { if (this.P && e.key === GL.k(this.P.id, 'card')) this.reload(); });
    this.poll = setInterval(this.reload, 2000);
    const el = this.stageRef.current;
    this.onMove = e => { this.showTip(e); const r = el.getBoundingClientRect(); this.hover = true; this.setVars((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); };
    this.onLeave = () => { this.hover = false; if (this.tipRef.current) this.tipRef.current.style.opacity = '0'; };
    el.addEventListener('pointermove', this.onMove);
    el.addEventListener('pointerleave', this.onLeave);
    const loop = t => {
      if (!this.hover) {
        if ((this.props.idle ?? true)) this.setVars(0.5 + Math.sin(t / 1800) * 0.32, 0.5 + Math.cos(t / 2300) * 0.28);
        else this.setVars(0.5, 0.5);
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { clearInterval(this.poll); window.removeEventListener('storage', this.onStorage); cancelAnimationFrame(this.raf); const el = this.stageRef.current; if (el) { el.removeEventListener('pointermove', this.onMove); el.removeEventListener('pointerleave', this.onLeave); } }
  componentDidUpdate() { this.applyFont(); }
  renderVals() {
    const c = this.state.card;
    const fallbackTags = ['VoG Flawless', 'Last Wish Flawless', 'Pantheon Flawless Trio', 'Shattered Throne Solo Flawless', 'Pit Solo Flawless', 'Presage Solo Flawless'];
    const short = n => n.replace(/^The /, '').replace('Vault of Glass', 'VoG').replace('Pit of Heresy', 'Pit').replace('Garden of Salvation', 'GoS').replace('Deep Stone Crypt', 'DSC').replace('Vow of the Disciple', 'VotD');
    const rank = t => /Solo Flawless/.test(t) ? 0 : /Flawless (Duo|Trio)/.test(t) ? 1 : /Flawless/.test(t) ? 2 : /Solo/.test(t) ? 3 : 4;
    const tags = c && c.tags && c.tags.length ? c.tags.slice().sort((a, b) => rank(a[1]) - rank(b[1])).slice(0, 8).map(([n, t]) => short(n) + ' ' + t) : fallbackTags;
    const curEmblem = this.state.emblemOverride || (c && c.emblem) || '';
    const tier = (() => {
      const A = (c && c.acts) || { raids: [], dungeons: [], missions: [] };
      const all = [...A.raids, ...A.dungeons, ...A.missions];
      const cnt = re => all.filter(r => r[2].some(t => re.test(t))).length;
      const flaw = cnt(/Flawless/), low = cnt(/Trio|Duo|Solo/), flawLow = cnt(/Flawless (Trio|Duo)|Solo Flawless/);
      const parts = [
        ['Raid clears', c ? c.raidClears : 0, 0.6],
        ['Dungeon clears', c ? c.dungeonClears : 0, 0.4],
        ['Flawless', flaw, 40],
        ['Lowman', low, 30],
        ['Flawless lowman', flawLow, 60],
        ['Triumph score', c && c.triumph ? c.triumph / 1000 : 0, 1],
        ['Guardian rank', c && c.gr ? c.gr : 0, 50],
        ['Commendations', c && c.commend ? c.commend.total : 0, 0.1]
      ];
      const score = Math.round(parts.reduce((s, [, v, w]) => s + v * w, 0));
      const T = [
        { code: 'C', name: 'Common', min: 0, holo: 0.25, frame: 'linear-gradient(135deg,#9aa0a8 0%,#5d636b 30%,#c4c8cd 52%,#585e66 76%,#a3a8af 100%)', badge: '#b4b9c0', text: '#b4b9c0' },
        { code: 'R', name: 'Rare', min: 800, holo: 0.45, frame: 'linear-gradient(135deg,oklch(0.75 0.12 245) 0%,oklch(0.48 0.13 255) 25%,oklch(0.85 0.08 230) 50%,oklch(0.45 0.12 255) 75%,oklch(0.72 0.12 245) 100%)', badge: 'oklch(0.75 0.12 245)', text: 'oklch(0.78 0.11 245)' },
        { code: 'SR', name: 'Super Rare', min: 1600, holo: 0.75, frame: 'linear-gradient(135deg,oklch(0.86 0.12 85) 0%,oklch(0.62 0.11 70) 22%,oklch(0.9 0.08 90) 48%,oklch(0.58 0.1 65) 74%,oklch(0.84 0.12 85) 100%)', badge: 'oklch(0.82 0.13 85)', text: 'oklch(0.82 0.13 85)' },
        { code: 'UR', name: 'Ultra Rare', min: 2600, holo: 1, frame: 'linear-gradient(135deg,oklch(0.75 0.17 330) 0%,oklch(0.45 0.16 300) 25%,oklch(0.85 0.1 340) 50%,oklch(0.42 0.15 295) 75%,oklch(0.72 0.17 325) 100%)', badge: 'oklch(0.75 0.17 330)', text: 'oklch(0.8 0.14 330)' },
        { code: 'SPR', name: 'Special Rare', min: 3600, holo: 1.3, frame: 'conic-gradient(from 200deg,#ff6fb5,#ffd36f,#7dffb0,#6fd8ff,#b48cff,#ff6fb5)', badge: 'linear-gradient(90deg,#ff6fb5,#ffd36f,#7dffb0,#6fd8ff,#b48cff)', text: '#ffd36f' }
      ];
      const forced = this.props.tierPreview && this.props.tierPreview !== 'auto' ? T.find(t => t.code === this.props.tierPreview) : null;
      const t = forced || T.slice().reverse().find(x => score >= x.min);
      this.tierHolo = t.holo;
      return { ...t, score: score.toLocaleString('en-US'), breakdown: t.name + ' · ' + score.toLocaleString('en-US') + ' pts\n' + parts.map(([n, v, w]) => n + '  +' + Math.round(v * w).toLocaleString('en-US')).join('\n') + '\n\nR 800 · SR 1,600 · UR 2,600 · SPR 3,600' };
    })();
    let qr = '';
    try { if (window.qrcode) { const qUrl = (c && c.raidUrl) || (this.P ? GL.reportUrl('raid', this.P) : 'https://raid.report'); if (this.qrFor !== qUrl) { const q = window.qrcode(0, 'M'); q.addData(qUrl); q.make(); this.qrUrl = q.createDataURL(4, 0); this.qrFor = qUrl; } qr = this.qrUrl; } else if (!this.qrWait) { this.qrWait = setInterval(() => { if (window.qrcode) { clearInterval(this.qrWait); this.forceUpdate(); } }, 200); } } catch (e) {}
    return {
      qr,
      qrImg: qr ? React.createElement('img', { src: qr, alt: 'raid.report QR', style: { display: 'block', width: 90, height: 90, imageRendering: 'pixelated', filter: 'invert(1)', mixBlendMode: 'screen' } }) : null,
      tier,
      stageRef: this.stageRef,
      tipRef: this.tipRef,
      font: this.props.font ?? 'space',
      power: (c && c.power) || '✦—',
      displayName: c && c.name ? c.name : this.state.noPlayer ? 'Find a Guardian' : 'Loading…',
      emblemBg: curEmblem ? `#15181c url('https://www.bungie.net${curEmblem}') left center / cover no-repeat` : '#15181c',
      raidShort: ((c && c.raidUrl) || '').replace('https://', ''),
      playerRaw: this.state.playerRaw || '',
      platformLine: this.P && window.GL ? ' · ' + ((GL.PLAT[this.P.type] || {}).label || 'Bungie') + (c && c.code ? ' · ' + c.name + '#' + c.code : '') : '',
      profileHref: this.P && window.GL ? GL.landing(this.P) : './Guardian Search.dc.html',
      editHref: './Profile Data Editor.dc.html' + (this.P && window.GL ? GL.qs(this.P) : ''),
      canEdit: !!(this.P && window.GL && this.state.auth && GL.isOwner(this.P)),
      showSignIn: !!(this.P && window.GL && !this.state.auth && GL.canLogin()),
      signIn: () => window.GL && GL.login(location.href),
      raidUrl: window.GL ? GL.reportUrl('raid', this.P) : '#',
      dungeonUrl: window.GL ? GL.reportUrl('dungeon', this.P) : '#',
      serial: c && c.serial ? String(c.serial.no).padStart(3, '0') + '/' + String(c.serial.total).padStart(3, '0') : '—/—',
      serialTip: c && c.serial ? 'Card No. ' + c.serial.no.toLocaleString('en-US') + '\n' + c.serial.total.toLocaleString('en-US') + ' Guardians looked up so far\nNumber = order of first lookup' : 'Card number\nAssigned on first lookup',
      hasPlayerRaw: !!this.state.playerRaw,
      emTabs: [['chars', 'Characters'], ['coll', 'Collections']].map(([k, label]) => ({ label, bg: this.state.emTab === k ? 'oklch(0.82 0.13 85)' : 'transparent', color: this.state.emTab === k ? '#0d0f12' : '#8a8f98', select: () => { this.setState({ emTab: k }); if (k === 'coll' && !this.state.coll) this.loadCollections(); } })),
      isChars: this.state.emTab === 'chars',
      isColl: this.state.emTab === 'coll',
      emStatus: this.state.emStatus,
      emFilter: this.state.emFilter,
      setEmFilter: e => this.setState({ emFilter: e.target.value }),
      charEmblems: ((c && c.charEmblems) || []).map(x => ({ label: x.label, bg: `#15181c url('https://www.bungie.net${x.path}') left center / cover no-repeat`, border: x.path === curEmblem ? 'oklch(0.82 0.13 85)' : '#2a2f37', pick: () => this.pickEmblem(x.path, x.label) })),
      collEmblems: (this.state.coll || []).filter(x => !this.state.emFilter || x.name.toLowerCase().includes(this.state.emFilter.toLowerCase())).slice(0, 240).map(x => ({ name: x.name, bg: `#15181c url('https://www.bungie.net${x.icon}') center / cover no-repeat`, border: '#2a2f37', pick: () => this.pickCollectible(x) })),
      headerStats: [
        c && c.gr != null ? { value: String(c.gr), label: 'Guardian rank' } : null,
        c && c.commend ? { value: Number(c.commend.total).toLocaleString('en-US'), label: 'Commendations' } : null,
        c && c.triumph != null ? { value: Number(c.triumph).toLocaleString('en-US'), label: 'Triumph score' } : null
      ].filter(Boolean),
      hasGr: !!(c && c.gr != null),
      gr: c && c.gr != null ? String(c.gr) : '',
      hasCommend: !!(c && c.commend),
      commendTotal: c && c.commend ? Number(c.commend.total).toLocaleString('en-US') : '',
      commendParts: c && c.commend ? c.commend.parts.map(x => ({ flex: x.pct + ' 1 0', color: x.color, title: x.name + '\n' + x.pct + '% of commendations', label: x.pct >= 12 ? x.name + ' ' + x.pct + '%' : x.pct + '%' })) : [],
      hasTriumph: !!(c && c.triumph != null),
      triumph: c && c.triumph != null ? Number(c.triumph).toLocaleString('en-US') : '',
      pipRows: (() => {
        const A = (c && c.acts) || { raids: [], dungeons: [], missions: [] };
        const gold = 'oklch(0.82 0.13 85)', red = 'oklch(0.62 0.2 25)';
        const pip = soloOnly => ([name, clears, tags]) => {
          const lowRe = soloOnly ? /Solo/ : /Trio|Duo|Solo/, flLowRe = soloOnly ? /Solo Flawless/ : /Flawless (Trio|Duo)|Solo Flawless/;
          const fl = tags.some(t => /Flawless/.test(t)), low = tags.some(t => lowRe.test(t) && !/Flawless/.test(t)), flLow = tags.some(t => flLowRe.test(t));
          const fill = fl ? gold : low || flLow ? red : '#1d2127';
          const ring = flLow ? red : fl ? gold : low ? red : '#3a404a';
          return { name: name + '\n' + clears + ' clears' + (tags.length ? '\n' + tags.join(' · ') : ''), clears, fill, ring, glow: fl || low || flLow ? '0 0 8px ' + fill : 'none', num: fl ? gold : low || flLow ? red : '#a9aeb6' };
        };
        const ORDER = ['Leviathan', 'Eater of Worlds', 'Spire of Stars', 'Last Wish', 'Scourge of the Past', 'Crown of Sorrow', 'Garden of Salvation', 'Deep Stone Crypt', 'Vault of Glass', 'Vow of the Disciple', "King's Fall", 'Root of Nightmares', "Crota's End", "Salvation's Edge", 'Pantheon', 'The Desert Perpetual',
          'Shattered Throne', 'Pit of Heresy', 'Prophecy', 'Grasp of Avarice', 'Duality', 'Spire of the Watcher', 'Ghosts of the Deep', "Warlord's Ruin", "Vesper's Host", 'Sundered Doctrine', 'Equilibrium',
          'The Whisper', 'Zero Hour', 'Harbinger', 'Presage'];
        const pos = n => { const i = ORDER.indexOf(n); return i < 0 ? 999 : i; };
        const HIDE = ['Pantheon'];
        const chrono = arr => arr.filter(r => !HIDE.includes(r[0])).sort((x, y) => pos(x[0]) - pos(y[0]));
        return [{ title: 'Exotic', arr: chrono(A.missions) }, { title: 'Dungeon', arr: chrono(A.dungeons) }, { title: 'Raid', arr: chrono(A.raids) }].map(g => ({ title: g.title, flex: Math.max(g.arr.length, 4) + ' 1 0', pips: g.arr.map(pip(g.title === 'Dungeon')) }));
      })(),
      stats: [
        { value: c ? String(c.raidClears) : '—', label: 'Raid clears' },
        { value: c && c.fullRaidClears != null ? String(c.fullRaidClears) : '—', label: 'Full raid clears' },
        { value: c ? String(c.dungeonClears) : '—', label: 'Dungeon clears' },
        { value: c && c.sherpas ? String(c.sherpas) : '—', label: 'Sherpas' }
      ]
    };
  }
}
</script>
